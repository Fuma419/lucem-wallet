name: Agent Auto PR

on:
  push:
    branches:
      - "agent/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')"

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(agent): merge ${BRANCH_NAME}" \
              --body "Automated PR from \`${BRANCH_NAME}\`.

              This PR was opened automatically from an agent branch.
              Auto-merge is enabled and will complete after required checks pass."

            pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')"
          fi

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "Failed to create or find PR for branch: $BRANCH_NAME"
            exit 1
          fi

          # Do not arm auto-merge unless a Jenkins check is present and green.
          jenkins_lines="$(gh pr view --repo "$REPO" "$pr_number" --json statusCheckRollup --jq '
            .statusCheckRollup[]
            | (
                if has("context") then
                  { name: .context, state: .state }
                else
                  { name: .name, state: (.conclusion // "PENDING") }
                end
              )
            | select((.name | test("jenkins"; "i")) and (.name | test("^Ping Jenkins indexer$") | not))
            | "\(.name)\t\(.state)"
          ')"

          if [ -z "${jenkins_lines:-}" ]; then
            echo "No Jenkins check/status found on PR #$pr_number. Skipping auto-merge enable for now."
            exit 0
          fi

          non_green_jenkins="$(printf '%s\n' "$jenkins_lines" | awk -F'\t' 'toupper($2) != "SUCCESS" { print $0 }')"
          if [ -n "${non_green_jenkins:-}" ]; then
            echo "Jenkins checks are not green yet; skipping auto-merge enable."
            printf '%s\n' "$non_green_jenkins"
            exit 0
          fi

          # Auto-merge waits for required checks and branch protection rules.
          gh pr merge --repo "$REPO" "$pr_number" --auto --squash --delete-branch || true
