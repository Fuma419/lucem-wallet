name: Agent Auto PR

on:
  push:
    branches:
      - "agent/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-pr-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  open-pr:
    name: "PR helper: open/update PR (Jenkins-gated auto-merge)"
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')"

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            gh pr create \
              --repo "$REPO" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore(agent): merge ${BRANCH_NAME}" \
              --body "Automated PR from \`${BRANCH_NAME}\`.

              This PR was opened automatically from an agent branch.
              Auto-merge is enabled and will complete after required checks pass."

            pr_number="$(gh pr list --repo "$REPO" --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')"
          fi

          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "Failed to create or find PR for branch: $BRANCH_NAME"
            exit 1
          fi

          # Do not arm auto-merge unless all required Jenkins gates are present and green.
          check_lines="$(gh pr view --repo "$REPO" "$pr_number" --json statusCheckRollup --jq '
            .statusCheckRollup[]
            | (
                if has("context") then
                  { name: .context, state: .state }
                else
                  { name: .name, state: (.conclusion // "PENDING") }
                end
              )
            | "\(.name)\t\(.state)"
          ')"

          required_checks=(
            "Jenkins gate: build"
            "Jenkins gate: unit tests"
            "Jenkins gate: functional tests"
          )

          missing_checks=()
          non_green_checks=()

          for check_name in "${required_checks[@]}"; do
            check_state="$(printf '%s\n' "${check_lines:-}" | awk -F'\t' -v name="$check_name" '$1 == name {state=toupper($2)} END {print state}')"
            if [ -z "${check_state:-}" ]; then
              missing_checks+=("$check_name")
              continue
            fi
            if [ "$check_state" != "SUCCESS" ]; then
              non_green_checks+=("$check_name"$'\t'"$check_state")
            fi
          done

          if [ "${#missing_checks[@]}" -gt 0 ]; then
            echo "Missing required Jenkins gates on PR #$pr_number. Skipping auto-merge enable for now."
            printf '%s\n' "${missing_checks[@]}"
            exit 0
          fi

          if [ "${#non_green_checks[@]}" -gt 0 ]; then
            echo "Required Jenkins gates are not green yet; skipping auto-merge enable."
            printf '%s\n' "${non_green_checks[@]}"
            exit 0
          fi

          # Auto-merge waits for required checks and branch protection rules.
          gh pr merge --repo "$REPO" "$pr_number" --auto --squash --delete-branch || true
