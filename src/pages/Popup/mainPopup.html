<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Lucem" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS standalone uses the *matching* prefers-color-scheme tag. A single
         theme-color is ignored in Light Mode and the Dynamic Island band goes white. -->
    <meta name="theme-color" content="#080808" />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080808" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/assets/img/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Lucem</title>
    <link
      rel="stylesheet"
      type="text/css"
      charset="UTF-8"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.min.css"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick-theme.min.css"
    />
    <style>
      html, body { margin: 0; padding: 0; background-color: #080808; color: white; color-scheme: dark; }
    </style>
    <script>
      (function () {
        var dark = true;
        try {
          if (localStorage.getItem('chakra-ui-color-mode') === 'light') dark = false;
        } catch (e) {}
        var color = dark ? '#080808' : '#f4f6fb';
        var scheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = color;
        document.documentElement.style.colorScheme = scheme;
        var tags = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < tags.length; i++) tags[i].setAttribute('content', color);
        var cs = document.querySelector('meta[name="color-scheme"]');
        if (cs) cs.setAttribute('content', scheme);
        var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (bar) bar.setAttribute('content', dark ? 'black' : 'default');
      })();
    </script>
  </head>

  <body>
    <div id="mainPopup"></div>
  </body>
</html>
